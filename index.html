<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEWORLDS - Watch TV Shows Online, Watch Movies Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-family: 'Bebas Neue', sans-serif; color: #E50914; font-size: 3rem; letter-spacing: 1px; text-decoration: none; }
        .google-btn-header { background-color: #ffffff; color: #757575; border: 1px solid #dadce0; padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .hero-section { position: relative; height: 100vh; background: linear-gradient(to top, #000 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%), url('https://images.unsplash.com/photo-1574267432553-4b4628081524?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .cta-btn { background-color: #E50914; color: white; padding: 16px 36px; font-size: 1.4rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">CINEWORLDS</a>
        <button class="google-btn-header" id="header-google-btn">Sign in with Google</button>
    </header>

    <section class="hero-section">
        <h1>Unlimited movies, TV shows, and more</h1>
        <button class="cta-btn" id="enter-btn">Enter CINEWORLDS</button>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBusEQOaEP8ATvNCNA8NZNSZSQQFBrHbWY",
            authDomain: "cineworlds-lk.firebaseapp.com",
            projectId: "cineworlds-lk",
            storageBucket: "cineworlds-lk.firebasestorage.app",
            messagingSenderId: "713662813047",
            appId: "1:713662813047:web:53c92085fe72526b0cc772",
            measurementId: "G-XN55EJ9P1T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "home.html";
        });

        const login = async () => {
            try { await signInWithPopup(auth, provider); } catch (e) { console.warn(e); }
        };

        document.getElementById("header-google-btn").addEventListener("click", login);
        document.getElementById("enter-btn").addEventListener("click", login);
    </script>
</body>
</html>
